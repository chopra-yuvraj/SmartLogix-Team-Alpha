version: "3.9"

# SmartLogix — Docker Compose (Task 0.2)
# Starts all development services in one command:
#   docker compose up --build

services:
  # ---- OSRM Router (self-hosted, India OSM extract) ----
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: smartlogix-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/data:/data
    command: osrm-routed --algorithm mld /data/india-latest.osrm
    restart: unless-stopped

  # ---- Go CVRPTW Solver ----
  solver:
    build:
      context: ./apps/solver
      dockerfile: Dockerfile
    container_name: smartlogix-solver
    ports:
      - "8081:8081"
    environment:
      SOLVER_PORT: "8081"
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      - osrm
    restart: unless-stopped

  # ---- FastAPI Gateway ----
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: smartlogix-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SOLVER_HOST: solver
      SOLVER_PORT: "8081"
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      - solver
    restart: unless-stopped

  # ---- Next.js Frontend (dev mode) ----
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: smartlogix-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - gateway
    restart: unless-stopped
