name: SmartLogix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.21"
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.11"

jobs:
  # ----------------------------------------------------------
  # Web — Next.js PWA
  # ----------------------------------------------------------
  web:
    name: "Web (Next.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # ----------------------------------------------------------
  # Gateway — FastAPI
  # ----------------------------------------------------------
  gateway:
    name: "Gateway (FastAPI)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check
        run: mypy . --ignore-missing-imports

      - name: Test
        run: pytest -v

  # ----------------------------------------------------------
  # Solver — Go DVRP
  # ----------------------------------------------------------
  solver:
    name: "Solver (Go)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/solver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: Benchmark
        run: go test -bench=. -benchmem ./internal/solver/
